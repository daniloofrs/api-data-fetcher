services:
  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    container_name: api-fetcher-app
    depends_on:
      - postgres-db
    env_file:
      - .env
    environment:
      - DB_HOST=postgres-db
    volumes:
      - ./data:/app/data
volumes:
  pgdata: